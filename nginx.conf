server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets (JS/CSS/fonts/images) -- safe to cache hard,
    # Vite gives every one of them a content hash in the filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router client-side routing: any path that isn't a real file
    # falls back to index.html so deep links (e.g. /flights, /book)
    # work on a hard refresh instead of 404ing at nginx.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
