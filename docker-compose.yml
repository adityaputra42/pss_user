# Standalone compose for pss_user on its own. Assumes the pss_modular_cqrs
# API is already running somewhere reachable (default: host port 8080,
# e.g. via that project's own docker-compose.yml).
#
# To run all three projects together instead, use the root-level
# docker-compose.yml one level up (see README / project layout notes)
# rather than this file.

services:
  user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    container_name: pss_user
    restart: unless-stopped
    ports:
      - "${USER_PORT:-3000}:80"
